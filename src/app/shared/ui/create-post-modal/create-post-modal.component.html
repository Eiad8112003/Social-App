<div
  *ngIf="socialService.isCreatePostModalOpen()"
  class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 bg-black/70 backdrop-blur-md transition-opacity animate-fade-in"
>
  <div
    [ngClass]="
      themeService.isDarkMode()
        ? 'bg-[#0f0c1f] border-white/10 text-slate-100'
        : 'bg-white border-slate-200 text-slate-900 shadow-2xl'
    "
    class="w-full max-w-xl rounded-2xl border shadow-2xl overflow-hidden flex flex-col transform transition-transform"
  >
    <!-- Modal Header -->
    <div
      [ngClass]="themeService.isDarkMode() ? 'border-white/10' : 'border-slate-200'"
      class="flex items-center justify-between px-6 py-4 border-b"
    >
      <h3 class="text-lg font-bold tracking-tight">Create new post</h3>
      <button
        type="button"
        (click)="closeModal()"
        [ngClass]="
          themeService.isDarkMode()
            ? 'text-slate-400 hover:text-white hover:bg-white/10'
            : 'text-slate-500 hover:text-slate-800 hover:bg-slate-100'
        "
        class="w-8 h-8 rounded-full flex items-center justify-center transition-colors cursor-pointer"
      >
        <i class="fa-solid fa-xmark text-base"></i>
      </button>
    </div>

    <!-- User Header & Scope Dropdown -->
    <div class="px-6 pt-5 flex items-center gap-3">
      <img
        [src]="socialService.currentUser().avatar"
        alt="User Avatar"
        class="w-10 h-10 rounded-full object-cover border border-purple-500/30"
      />
      <div>
        <h4 class="text-sm font-semibold leading-tight">
          {{ socialService.currentUser().name }}
        </h4>
        <div class="relative mt-1">
          <select
            [(ngModel)]="visibility"
            [ngClass]="
              themeService.isDarkMode()
                ? 'bg-[#18142b] border-white/10 text-slate-300'
                : 'bg-slate-100 border-slate-200 text-slate-700'
            "
            class="px-2.5 py-0.5 rounded-lg border text-xs font-medium focus:outline-none cursor-pointer pr-6 appearance-none"
          >
            <option value="Public">🌐 Public</option>
            <option value="Friends">👥 Friends</option>
            <option value="Only Me">🔒 Only Me</option>
          </select>
          <i
            class="fa-solid fa-chevron-down text-[10px] text-slate-400 absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none"
          ></i>
        </div>
      </div>
    </div>

    <!-- Textarea Content Input -->
    <div class="px-6 py-4 flex-1 relative min-h-[140px]">
      <textarea
        [(ngModel)]="postContent"
        [placeholder]="'What\'s on your mind, ' + socialService.currentUser().name + '?'"
        [ngClass]="
          themeService.isDarkMode()
            ? 'text-slate-100 placeholder:text-slate-500'
            : 'text-slate-800 placeholder:text-slate-400'
        "
        class="w-full h-32 bg-transparent border-none focus:outline-none text-base resize-none p-0 font-normal leading-relaxed"
      ></textarea>

      <!-- Selected Image Preview if any -->
      <div *ngIf="selectedImage" class="relative rounded-xl overflow-hidden mt-2 group border border-purple-500/20">
        <img [src]="selectedImage" class="w-full max-h-48 object-cover rounded-xl" />
        <button
          (click)="selectedImage = undefined"
          class="absolute top-2 right-2 bg-black/60 text-white rounded-full w-7 h-7 flex items-center justify-center hover:bg-black transition-colors"
        >
          <i class="fa-solid fa-xmark text-xs"></i>
        </button>
      </div>

      <!-- Emoji Picker trigger button inside area -->
      <button
        type="button"
        [ngClass]="themeService.isDarkMode() ? 'text-slate-400 hover:text-purple-400' : 'text-slate-500 hover:text-purple-600'"
        class="absolute bottom-2 right-6 text-lg transition-colors cursor-pointer"
      >
        <i class="fa-regular fa-face-smile"></i>
      </button>
    </div>

    <!-- Media Attachments Bar -->
    <div class="px-6 py-2">
      <div
        [ngClass]="
          themeService.isDarkMode()
            ? 'bg-[#151126] border-white/10'
            : 'bg-slate-50 border-slate-200'
        "
        class="p-2.5 rounded-xl border flex items-center justify-between flex-wrap gap-2"
      >
        <div class="flex items-center gap-1 sm:gap-2">
          <!-- Photo/Video button -->
          <button
            type="button"
            (click)="attachSampleImage()"
            [ngClass]="
              themeService.isDarkMode()
                ? 'hover:bg-white/5 text-slate-300'
                : 'hover:bg-slate-200 text-slate-700'
            "
            class="px-2.5 py-1.5 rounded-lg text-xs font-medium flex items-center gap-2 transition-colors cursor-pointer"
          >
            <i class="fa-regular fa-image text-emerald-400 text-sm"></i>
            <span>Photo / Video</span>
          </button>

          <!-- Feeling button -->
          <button
            type="button"
            [ngClass]="
              themeService.isDarkMode()
                ? 'hover:bg-white/5 text-slate-300'
                : 'hover:bg-slate-200 text-slate-700'
            "
            class="px-2.5 py-1.5 rounded-lg text-xs font-medium flex items-center gap-2 transition-colors cursor-pointer"
          >
            <i class="fa-regular fa-face-laugh text-amber-400 text-sm"></i>
            <span class="hidden sm:inline">Feeling</span>
          </button>

          <!-- Location button -->
          <button
            type="button"
            [ngClass]="
              themeService.isDarkMode()
                ? 'hover:bg-white/5 text-slate-300'
                : 'hover:bg-slate-200 text-slate-700'
            "
            class="px-2.5 py-1.5 rounded-lg text-xs font-medium flex items-center gap-2 transition-colors cursor-pointer"
          >
            <i class="fa-solid fa-location-dot text-purple-400 text-sm"></i>
            <span class="hidden sm:inline">Location</span>
          </button>

          <!-- Poll button -->
          <button
            type="button"
            [ngClass]="
              themeService.isDarkMode()
                ? 'hover:bg-white/5 text-slate-300'
                : 'hover:bg-slate-200 text-slate-700'
            "
            class="px-2.5 py-1.5 rounded-lg text-xs font-medium flex items-center gap-2 transition-colors cursor-pointer"
          >
            <i class="fa-solid fa-chart-simple text-blue-400 text-sm"></i>
            <span class="hidden sm:inline">Poll</span>
          </button>
        </div>

        <button
          type="button"
          [ngClass]="themeService.isDarkMode() ? 'text-slate-400 hover:text-white' : 'text-slate-500 hover:text-slate-800'"
          class="p-1.5 rounded-lg transition-colors cursor-pointer"
        >
          <i class="fa-solid fa-ellipsis text-sm"></i>
        </button>
      </div>
    </div>

    <!-- Modal Footer Controls & Action -->
    <div
      [ngClass]="themeService.isDarkMode() ? 'border-white/10' : 'border-slate-200'"
      class="px-6 py-4 border-t flex items-center justify-between"
    >
      <div class="flex items-center gap-2 text-slate-400">
        <button type="button" class="p-1.5 hover:text-purple-400 transition-colors cursor-pointer">
          <span class="font-semibold text-sm">Aa</span>
        </button>
        <button type="button" class="p-1.5 hover:text-purple-400 transition-colors cursor-pointer">
          <i class="fa-regular fa-clock text-sm"></i>
        </button>
      </div>

      <button
        type="button"
        (click)="submitPost()"
        [disabled]="!postContent.trim() && !selectedImage"
        class="px-6 py-2.5 bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-semibold text-sm rounded-xl shadow-lg shadow-purple-600/30 transition-all flex items-center gap-2 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
      >
        <span>Post</span>
        <i class="fa-solid fa-chevron-down text-xs opacity-70"></i>
      </button>
    </div>
  </div>
</div>
