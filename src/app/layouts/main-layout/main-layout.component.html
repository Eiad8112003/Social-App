<div
  [ngClass]="
    themeService.isDarkMode()
      ? 'bg-[#070611] text-slate-100'
      : 'bg-slate-100 text-slate-900'
  "
  class="min-h-screen w-full flex font-sans selection:bg-purple-600 selection:text-white transition-colors duration-300 relative"
>
  <!-- Mobile Sidebar Backdrop -->
  <div
    *ngIf="isMobileSidebarOpen"
    (click)="toggleMobileSidebar()"
    class="fixed inset-0 bg-black/60 z-40 lg:hidden backdrop-blur-sm"
  ></div>

  <!-- LEFT SIDEBAR -->
  <aside
    [ngClass]="[
      themeService.isDarkMode()
        ? 'bg-[#0a0817] border-white/10'
        : 'bg-white border-slate-200',
      isMobileSidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'
    ]"
    class="w-64 fixed top-0 bottom-0 left-0 z-50 border-r flex flex-col justify-between p-5 transition-transform duration-300 overflow-y-auto"
  >
    <div>
      <!-- Brand Logo Header -->
      <div class="flex items-center gap-3 px-2 mb-8 cursor-pointer" routerLink="/main/feed">
        <div
          class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-purple-600 flex items-center justify-center font-black text-white text-lg shadow-lg shadow-purple-600/30"
        >
          R
        </div>
        <span class="font-bold text-lg tracking-tight">Route Posts</span>
      </div>

      <!-- Navigation Links -->
      <nav class="space-y-1">
        <!-- Home / Feed -->
        <a
          routerLink="/main/feed"
          routerLinkActive="active-nav"
          class="nav-link flex items-center gap-3.5 px-3.5 py-3 rounded-xl text-sm font-medium transition-all"
        >
          <i class="fa-solid fa-house text-base w-5 text-center"></i>
          <span>Home</span>
        </a>

        <!-- Explore -->
        <a
          routerLink="/main/explore"
          routerLinkActive="active-nav"
          class="nav-link flex items-center gap-3.5 px-3.5 py-3 rounded-xl text-sm font-medium transition-all"
        >
          <i class="fa-solid fa-compass text-base w-5 text-center"></i>
          <span>Explore</span>
        </a>

        <!-- Following -->
        <a
          routerLink="/main/following"
          routerLinkActive="active-nav"
          class="nav-link flex items-center gap-3.5 px-3.5 py-3 rounded-xl text-sm font-medium transition-all"
        >
          <i class="fa-solid fa-user-group text-base w-5 text-center"></i>
          <span>Following</span>
        </a>

        <!-- Communities -->
        <a
          routerLink="/main/communities"
          routerLinkActive="active-nav"
          class="nav-link flex items-center gap-3.5 px-3.5 py-3 rounded-xl text-sm font-medium transition-all"
        >
          <i class="fa-solid fa-shapes text-base w-5 text-center"></i>
          <span>Communities</span>
        </a>

        <!-- Saved -->
        <a
          routerLink="/main/saved"
          routerLinkActive="active-nav"
          class="nav-link flex items-center gap-3.5 px-3.5 py-3 rounded-xl text-sm font-medium transition-all"
        >
          <i class="fa-solid fa-bookmark text-base w-5 text-center"></i>
          <span>Saved</span>
        </a>

        <!-- My Posts -->
        <a
          routerLink="/main/profile"
          routerLinkActive="active-nav"
          class="nav-link flex items-center gap-3.5 px-3.5 py-3 rounded-xl text-sm font-medium transition-all"
        >
          <i class="fa-solid fa-pen-to-square text-base w-5 text-center"></i>
          <span>My Posts</span>
        </a>

        <!-- Messages -->
        <a
          routerLink="/main/messages"
          routerLinkActive="active-nav"
          class="nav-link flex items-center justify-between px-3.5 py-3 rounded-xl text-sm font-medium transition-all"
        >
          <div class="flex items-center gap-3.5">
            <i class="fa-regular fa-envelope text-base w-5 text-center"></i>
            <span>Messages</span>
          </div>
          <span
            class="px-2 py-0.5 text-[11px] font-bold rounded-full bg-purple-600 text-white shadow-sm"
            >3</span
          >
        </a>

        <!-- Notifications -->
        <a
          routerLink="/main/notification"
          routerLinkActive="active-nav"
          class="nav-link flex items-center justify-between px-3.5 py-3 rounded-xl text-sm font-medium transition-all"
        >
          <div class="flex items-center gap-3.5">
            <i class="fa-regular fa-bell text-base w-5 text-center"></i>
            <span>Notifications</span>
          </div>
          <span
            class="px-2 py-0.5 text-[11px] font-bold rounded-full bg-purple-600 text-white shadow-sm"
            >5</span
          >
        </a>

        <!-- Settings -->
        <a
          routerLink="/main/settings"
          routerLinkActive="active-nav"
          class="nav-link flex items-center gap-3.5 px-3.5 py-3 rounded-xl text-sm font-medium transition-all"
        >
          <i class="fa-solid fa-gear text-base w-5 text-center"></i>
          <span>Settings</span>
        </a>
      </nav>

      <!-- Create Post Button -->
      <button
        type="button"
        (click)="openCreatePostModal()"
        class="w-full mt-6 py-3 px-4 bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 hover:from-blue-500 hover:via-indigo-500 hover:to-purple-500 text-white font-semibold text-sm rounded-xl shadow-lg shadow-purple-600/30 transition-all flex items-center justify-center gap-2 cursor-pointer group"
      >
        <i class="fa-solid fa-plus text-sm group-hover:rotate-90 transition-transform"></i>
        <span>Create Post</span>
      </button>
    </div>

    <!-- Sidebar Bottom Controls -->
    <div class="pt-6 space-y-4 border-t" [ngClass]="themeService.isDarkMode() ? 'border-white/10' : 'border-slate-200'">
      <!-- Current User Badge -->
      <div
        routerLink="/main/profile"
        [ngClass]="
          themeService.isDarkMode()
            ? 'hover:bg-white/5 border-white/5'
            : 'hover:bg-slate-100 border-slate-200'
        "
        class="flex items-center justify-between p-2.5 rounded-xl border transition-all cursor-pointer group"
      >
        <div class="flex items-center gap-3">
          <div class="relative">
            <img
              [src]="socialService.currentUser().avatar"
              alt="User Avatar"
              class="w-9 h-9 rounded-full object-cover border border-purple-500/30"
            />
            <span
              class="w-2.5 h-2.5 rounded-full bg-emerald-500 border-2 border-[#0a0817] absolute bottom-0 right-0"
            ></span>
          </div>
          <div>
            <h4 class="text-xs font-bold leading-tight group-hover:text-purple-400 transition-colors">
              {{ socialService.currentUser().name }}
            </h4>
            <p class="text-[11px] text-slate-400 font-normal">
              {{ socialService.currentUser().username }}
            </p>
          </div>
        </div>
        <i class="fa-solid fa-ellipsis text-xs text-slate-400"></i>
      </div>

      <!-- Dark Mode Switch -->
      <div class="flex items-center justify-between px-2 pt-1">
        <div class="flex items-center gap-2 text-xs font-medium text-slate-400">
          <i class="fa-regular fa-moon"></i>
          <span>Dark Mode</span>
        </div>
        <label class="relative inline-flex items-center cursor-pointer">
          <input
            type="checkbox"
            [checked]="themeService.isDarkMode()"
            (change)="toggleDarkMode()"
            class="sr-only peer"
          />
          <div
            class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-purple-600"
          ></div>
        </label>
      </div>
    </div>
  </aside>

  <!-- MAIN APP CONTAINER -->
  <div class="flex-1 lg:ml-64 flex flex-col min-h-screen">
    <!-- TOP HEADER NAVBAR -->
    <header
      [ngClass]="
        themeService.isDarkMode()
          ? 'bg-[#070611]/90 border-white/10 backdrop-blur-md'
          : 'bg-white/90 border-slate-200 backdrop-blur-md'
      "
      class="sticky top-0 z-30 h-16 border-b px-4 sm:px-8 flex items-center justify-between gap-4 transition-colors"
    >
      <!-- Mobile Menu Toggle -->
      <button
        (click)="toggleMobileSidebar()"
        class="lg:hidden p-2 text-slate-400 hover:text-white"
      >
        <i class="fa-solid fa-bars text-lg"></i>
      </button>

      <!-- Global Search Bar -->
      <div class="flex-1 max-w-md relative">
        <i
          class="fa-solid fa-magnifying-glass text-slate-400 text-xs absolute left-3.5 top-1/2 -translate-y-1/2"
        ></i>
        <input
          type="text"
          placeholder="Search for people, posts, communities..."
          [ngClass]="
            themeService.isDarkMode()
              ? 'bg-[#120f24] border-white/10 text-slate-200 placeholder:text-slate-500 focus:border-purple-500/60'
              : 'bg-slate-100 border-slate-200 text-slate-800 placeholder:text-slate-400 focus:border-purple-500'
          "
          class="w-full py-2 pl-9 pr-12 text-xs rounded-xl border focus:outline-none transition-all"
        />
        <span
          [ngClass]="
            themeService.isDarkMode()
              ? 'bg-[#1c1833] text-slate-400 border-white/10'
              : 'bg-slate-200 text-slate-600 border-slate-300'
          "
          class="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] px-1.5 py-0.5 rounded border font-mono pointer-events-none"
        >
          ⌘ K
        </span>
      </div>

      <!-- Header Right Shortcuts & User Profile -->
      <div class="flex items-center gap-3 sm:gap-4">
        <!-- Quick Home Icon -->
        <a
          routerLink="/main/feed"
          [ngClass]="
            themeService.isDarkMode()
              ? 'hover:bg-white/10 text-slate-300'
              : 'hover:bg-slate-100 text-slate-600'
          "
          class="w-9 h-9 rounded-xl flex items-center justify-center transition-colors cursor-pointer"
        >
          <i class="fa-solid fa-house text-sm"></i>
        </a>

        <!-- Messages Icon with badge -->
        <a
          routerLink="/main/messages"
          [ngClass]="
            themeService.isDarkMode()
              ? 'hover:bg-white/10 text-slate-300'
              : 'hover:bg-slate-100 text-slate-600'
          "
          class="w-9 h-9 rounded-xl flex items-center justify-center relative transition-colors cursor-pointer"
        >
          <i class="fa-regular fa-envelope text-sm"></i>
          <span
            class="absolute top-1.5 right-1.5 w-4 h-4 rounded-full bg-purple-600 text-white text-[9px] font-bold flex items-center justify-center"
          >
            3
          </span>
        </a>

        <!-- Notifications Icon with badge -->
        <a
          routerLink="/main/notification"
          [ngClass]="
            themeService.isDarkMode()
              ? 'hover:bg-white/10 text-slate-300'
              : 'hover:bg-slate-100 text-slate-600'
          "
          class="w-9 h-9 rounded-xl flex items-center justify-center relative transition-colors cursor-pointer"
        >
          <i class="fa-regular fa-bell text-sm"></i>
          <span
            class="absolute top-1.5 right-1.5 w-4 h-4 rounded-full bg-purple-600 text-white text-[9px] font-bold flex items-center justify-center"
          >
            5
          </span>
        </a>

        <!-- Header User Profile snippet -->
        <a
          routerLink="/main/profile"
          class="flex items-center gap-2.5 pl-2 border-l border-slate-700/50 hover:opacity-90 transition-opacity cursor-pointer"
        >
          <img
            [src]="socialService.currentUser().avatar"
            alt="Profile Avatar"
            class="w-8 h-8 rounded-full object-cover border border-purple-500/30"
          />
          <span class="text-xs font-semibold hidden sm:inline">
            {{ socialService.currentUser().name }}
          </span>
        </a>
      </div>
    </header>

    <!-- CONTENT ROUTER OUTLET -->
    <main class="flex-1 p-4 sm:p-6 lg:p-8">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- CREATE POST MODAL COMPONENT -->
  <app-create-post-modal></app-create-post-modal>
</div>
