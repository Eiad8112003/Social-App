<div class="max-w-xl mx-auto py-8 px-4">
  <div
    [ngClass]="
      themeService.isDarkMode()
        ? 'bg-[#0a0817] border-white/10 text-slate-100'
        : 'bg-white border-slate-200 text-slate-900 shadow-sm'
    "
    class="rounded-3xl border p-6 sm:p-8 space-y-6 transition-colors"
  >
    <div class="flex items-center justify-between">
      <div>
        <h2 class="text-xl sm:text-2xl font-bold tracking-tight">Change Password</h2>
        <p
          [ngClass]="themeService.isDarkMode() ? 'text-slate-400' : 'text-slate-500'"
          class="text-xs sm:text-sm mt-1"
        >
          Update your account password to keep your account secure.
        </p>
      </div>
      <a
        routerLink="/main/settings"
        [ngClass]="
          themeService.isDarkMode()
            ? 'bg-[#151228] border-white/10 text-slate-300 hover:text-white'
            : 'bg-slate-100 border-slate-200 text-slate-700 hover:text-slate-900'
        "
        class="px-3 py-1.5 rounded-xl border text-xs font-medium transition"
      >
        Back to Settings
      </a>
    </div>

    <div
      *ngIf="errorMessage"
      class="p-3.5 rounded-xl bg-red-500/10 border border-red-500/30 text-red-500 flex items-center justify-between text-xs sm:text-sm"
    >
      <div class="flex items-center gap-2.5">
        <i class="fa-solid fa-circle-exclamation text-base shrink-0"></i>
        <span>{{ errorMessage }}</span>
      </div>
      <button type="button" (click)="errorMessage = ''" class="p-1 cursor-pointer">
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>
    </div>

    <div
      *ngIf="successMessage"
      class="p-3.5 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-500 flex items-center gap-2.5 text-xs sm:text-sm"
    >
      <i class="fa-solid fa-circle-check text-base shrink-0"></i>
      <span>{{ successMessage }}</span>
    </div>

    <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <div
          [ngClass]="
            isFieldInvalid('currentPassword')
              ? 'border-red-500 bg-red-500/5'
              : themeService.isDarkMode()
                ? 'bg-[#151228] border-white/10 focus-within:border-purple-500/80'
                : 'bg-slate-50 border-slate-200 focus-within:bg-white focus-within:border-purple-600'
          "
          class="border rounded-xl px-4 py-2.5 transition-all"
        >
          <label
            [ngClass]="themeService.isDarkMode() ? 'text-slate-400' : 'text-slate-500'"
            class="block text-[11px] font-semibold mb-1"
          >
            Current Password
          </label>
          <div class="flex items-center justify-between gap-3">
            <input
              [type]="showCurrentPassword ? 'text' : 'password'"
              formControlName="currentPassword"
              placeholder="Enter current password"
              class="w-full bg-transparent border-none text-sm focus:outline-none p-0 font-medium"
            />
            <button
              type="button"
              (click)="showCurrentPassword = !showCurrentPassword"
              class="text-slate-400 hover:text-slate-200 cursor-pointer"
            >
              <i [class]="showCurrentPassword ? 'fa-regular fa-eye-slash text-sm' : 'fa-regular fa-eye text-sm'"></i>
            </button>
          </div>
        </div>
        <p *ngIf="isFieldInvalid('currentPassword')" class="text-red-400 text-xs mt-1 px-1">
          {{ getFieldError('currentPassword') }}
        </p>
      </div>

      <div>
        <div
          [ngClass]="
            isFieldInvalid('newPassword')
              ? 'border-red-500 bg-red-500/5'
              : themeService.isDarkMode()
                ? 'bg-[#151228] border-white/10 focus-within:border-purple-500/80'
                : 'bg-slate-50 border-slate-200 focus-within:bg-white focus-within:border-purple-600'
          "
          class="border rounded-xl px-4 py-2.5 transition-all"
        >
          <label
            [ngClass]="themeService.isDarkMode() ? 'text-slate-400' : 'text-slate-500'"
            class="block text-[11px] font-semibold mb-1"
          >
            New Password
          </label>
          <div class="flex items-center justify-between gap-3">
            <input
              [type]="showNewPassword ? 'text' : 'password'"
              formControlName="newPassword"
              placeholder="Enter new password"
              class="w-full bg-transparent border-none text-sm focus:outline-none p-0 font-medium"
            />
            <button
              type="button"
              (click)="showNewPassword = !showNewPassword"
              class="text-slate-400 hover:text-slate-200 cursor-pointer"
            >
              <i [class]="showNewPassword ? 'fa-regular fa-eye-slash text-sm' : 'fa-regular fa-eye text-sm'"></i>
            </button>
          </div>
        </div>
        <p *ngIf="isFieldInvalid('newPassword')" class="text-red-400 text-xs mt-1 px-1">
          {{ getFieldError('newPassword') }}
        </p>
      </div>

      <div>
        <div
          [ngClass]="
            isFieldInvalid('confirmNewPassword')
              ? 'border-red-500 bg-red-500/5'
              : themeService.isDarkMode()
                ? 'bg-[#151228] border-white/10 focus-within:border-purple-500/80'
                : 'bg-slate-50 border-slate-200 focus-within:bg-white focus-within:border-purple-600'
          "
          class="border rounded-xl px-4 py-2.5 transition-all"
        >
          <label
            [ngClass]="themeService.isDarkMode() ? 'text-slate-400' : 'text-slate-500'"
            class="block text-[11px] font-semibold mb-1"
          >
            Confirm New Password
          </label>
          <div class="flex items-center justify-between gap-3">
            <input
              [type]="showConfirmPassword ? 'text' : 'password'"
              formControlName="confirmNewPassword"
              placeholder="Confirm new password"
              class="w-full bg-transparent border-none text-sm focus:outline-none p-0 font-medium"
            />
            <button
              type="button"
              (click)="showConfirmPassword = !showConfirmPassword"
              class="text-slate-400 hover:text-slate-200 cursor-pointer"
            >
              <i [class]="showConfirmPassword ? 'fa-regular fa-eye-slash text-sm' : 'fa-regular fa-eye text-sm'"></i>
            </button>
          </div>
        </div>
        <p *ngIf="isFieldInvalid('confirmNewPassword')" class="text-red-400 text-xs mt-1 px-1">
          {{ getFieldError('confirmNewPassword') }}
        </p>
      </div>

      <button
        type="submit"
        [disabled]="isSubmitting"
        class="w-full py-3 px-6 bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 hover:from-blue-500 hover:via-indigo-500 hover:to-purple-500 text-white font-semibold text-sm rounded-xl shadow-lg shadow-purple-600/25 transition-all cursor-pointer disabled:opacity-60"
      >
        {{ isSubmitting ? 'Updating...' : 'Update Password' }}
      </button>
    </form>
  </div>
</div>
