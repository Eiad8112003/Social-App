<div class="max-w-4xl mx-auto space-y-6">
  <!-- Notifications Title Header -->
  <div class="flex items-center justify-between">
    <h2
      [ngClass]="themeService.isDarkMode() ? 'text-slate-100' : 'text-slate-900'"
      class="text-2xl font-bold tracking-tight"
    >
      Notifications
    </h2>
    <button
      (click)="markAllAsRead()"
      class="text-xs font-semibold text-purple-400 hover:underline cursor-pointer"
    >
      Mark all as read
    </button>
  </div>

  <!-- Filter Pills Bar -->
  <div class="flex items-center gap-2">
    <button
      (click)="setFilter('All')"
      [ngClass]="
        activeFilter === 'All'
          ? 'bg-gradient-to-r from-blue-600 to-purple-600 text-white shadow-lg shadow-purple-600/30'
          : themeService.isDarkMode()
          ? 'bg-[#0a0817] text-slate-400 border border-white/10 hover:text-slate-200'
          : 'bg-white text-slate-600 border border-slate-200'
      "
      class="px-4 py-1.5 rounded-xl text-xs font-semibold transition-all cursor-pointer"
    >
      All
    </button>

    <button
      (click)="setFilter('Unread')"
      [ngClass]="
        activeFilter === 'Unread'
          ? 'bg-gradient-to-r from-blue-600 to-purple-600 text-white shadow-lg shadow-purple-600/30'
          : themeService.isDarkMode()
          ? 'bg-[#0a0817] text-slate-400 border border-white/10 hover:text-slate-200'
          : 'bg-white text-slate-600 border border-slate-200'
      "
      class="px-4 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-2 transition-all cursor-pointer"
    >
      <span>Unread</span>
      <span
        class="px-1.5 py-0.2 rounded-full bg-purple-600 text-white text-[10px] font-bold"
      >
        5
      </span>
    </button>
  </div>

  <!-- Today Section -->
  <div class="space-y-3">
    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider px-1">Today</h3>

    <div
      *ngFor="let notif of notificationsToday"
      [ngClass]="[
        themeService.isDarkMode()
          ? 'bg-[#0a0817] border-white/10 hover:border-purple-500/40'
          : 'bg-white border-slate-200 shadow-sm hover:shadow-md',
        !notif.isRead ? 'border-l-4 border-l-purple-500' : ''
      ]"
      class="p-4 rounded-2xl border flex items-center justify-between gap-4 transition-all"
    >
      <div class="flex items-center gap-3.5">
        <div class="relative">
          <img
            [src]="notif.user.avatar"
            alt="Avatar"
            class="w-10 h-10 rounded-full object-cover border border-purple-500/30"
          />
          <span
            *ngIf="notif.type === 'like'"
            class="w-4 h-4 rounded-full bg-rose-500 text-white text-[9px] flex items-center justify-center absolute -bottom-1 -right-1 shadow-sm"
          >
            <i class="fa-solid fa-heart"></i>
          </span>
          <span
            *ngIf="notif.type === 'follow'"
            class="w-4 h-4 rounded-full bg-blue-500 text-white text-[9px] flex items-center justify-center absolute -bottom-1 -right-1 shadow-sm"
          >
            <i class="fa-solid fa-user-plus"></i>
          </span>
          <span
            *ngIf="notif.type === 'comment'"
            class="w-4 h-4 rounded-full bg-purple-500 text-white text-[9px] flex items-center justify-center absolute -bottom-1 -right-1 shadow-sm"
          >
            <i class="fa-solid fa-comment"></i>
          </span>
          <span
            *ngIf="notif.type === 'share'"
            class="w-4 h-4 rounded-full bg-emerald-500 text-white text-[9px] flex items-center justify-center absolute -bottom-1 -right-1 shadow-sm"
          >
            <i class="fa-solid fa-share"></i>
          </span>
        </div>

        <div>
          <p class="text-xs sm:text-sm text-slate-200 leading-snug">
            <span class="font-bold text-slate-100">{{ notif.user.name }}</span>
            <span class="ml-1 text-slate-300">{{ notif.action }}</span>
            <span *ngIf="notif.target" class="ml-1 text-purple-300 font-medium">{{ notif.target }}</span>
          </p>
          <span class="text-[11px] text-slate-400 mt-0.5 block">{{ notif.time }}</span>
        </div>
      </div>

      <!-- Thumbnail preview if post item -->
      <img
        *ngIf="notif.thumbnail"
        [src]="notif.thumbnail"
        class="w-12 h-12 rounded-xl object-cover border border-purple-500/20 shrink-0"
      />
    </div>
  </div>

  <!-- Yesterday Section -->
  <div class="space-y-3 pt-4">
    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider px-1">Yesterday</h3>

    <div
      *ngFor="let notif of notificationsYesterday"
      [ngClass]="
        themeService.isDarkMode()
          ? 'bg-[#0a0817] border-white/10 hover:border-purple-500/40'
          : 'bg-white border-slate-200 shadow-sm hover:shadow-md'
      "
      class="p-4 rounded-2xl border flex items-center justify-between gap-4 transition-all"
    >
      <div class="flex items-center gap-3.5">
        <div class="relative">
          <img
            [src]="notif.user.avatar"
            alt="Avatar"
            class="w-10 h-10 rounded-full object-cover border border-purple-500/30"
          />
          <span
            *ngIf="notif.type === 'like'"
            class="w-4 h-4 rounded-full bg-rose-500 text-white text-[9px] flex items-center justify-center absolute -bottom-1 -right-1"
          >
            <i class="fa-solid fa-heart"></i>
          </span>
          <span
            *ngIf="notif.type === 'share'"
            class="w-4 h-4 rounded-full bg-emerald-500 text-white text-[9px] flex items-center justify-center absolute -bottom-1 -right-1"
          >
            <i class="fa-solid fa-share"></i>
          </span>
        </div>

        <div>
          <p class="text-xs sm:text-sm text-slate-200 leading-snug">
            <span class="font-bold text-slate-100">{{ notif.user.name }}</span>
            <span class="ml-1 text-slate-300">{{ notif.action }}</span>
          </p>
          <span class="text-[11px] text-slate-400 mt-0.5 block">{{ notif.time }}</span>
        </div>
      </div>

      <img
        *ngIf="notif.thumbnail"
        [src]="notif.thumbnail"
        class="w-12 h-12 rounded-xl object-cover border border-purple-500/20 shrink-0"
      />
    </div>
  </div>
</div>
