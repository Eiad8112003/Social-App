<div
  [ngClass]="themeService.isDarkMode() ? 'bg-[#070611] text-slate-100' : 'bg-slate-100 text-slate-800'"
  class="min-h-screen w-full flex items-center justify-center p-4 sm:p-6 font-sans transition-colors duration-300"
>
  <div
    [ngClass]="
      themeService.isDarkMode()
        ? 'bg-[#0a0817] border-white/10 shadow-purple-950/30'
        : 'bg-white border-slate-200/80 shadow-xl'
    "
    class="w-full max-w-md rounded-3xl border p-6 sm:p-8 space-y-6 transition-colors duration-300"
  >
    <div class="flex items-center justify-between">
      <a
        routerLink="/auth/login"
        [ngClass]="
          themeService.isDarkMode()
            ? 'bg-[#171429] border-white/10 text-slate-300 hover:text-white'
            : 'bg-slate-100 border-slate-200 text-slate-700 hover:text-slate-900'
        "
        class="w-9 h-9 rounded-xl border flex items-center justify-center transition-all"
      >
        <i class="fa-solid fa-chevron-left text-xs"></i>
      </a>

      <button
        type="button"
        (click)="toggleDarkMode()"
        [ngClass]="
          themeService.isDarkMode()
            ? 'bg-[#171429] border-white/10 text-slate-300 hover:text-white'
            : 'bg-slate-100 border-slate-200 text-slate-700 hover:text-slate-900'
        "
        class="px-3.5 py-1.5 rounded-xl border text-xs font-medium flex items-center gap-2 transition-all cursor-pointer"
      >
        <i
          [class]="
            themeService.isDarkMode()
              ? 'fa-solid fa-moon text-purple-400 text-xs'
              : 'fa-solid fa-sun text-amber-500 text-xs'
          "
        ></i>
        <span>{{ themeService.isDarkMode() ? 'Dark' : 'Light' }}</span>
      </button>
    </div>

    <div>
      <h2 class="text-2xl font-bold tracking-tight">Forgot password?</h2>
      <p
        [ngClass]="themeService.isDarkMode() ? 'text-slate-400' : 'text-slate-500'"
        class="text-xs sm:text-sm mt-1"
      >
        Enter your email address and we'll send you instructions to reset your password.
      </p>
    </div>

    <div
      *ngIf="errorMessage"
      class="p-3.5 rounded-xl bg-red-500/10 border border-red-500/30 text-red-500 flex items-center justify-between text-xs sm:text-sm"
    >
      <div class="flex items-center gap-2.5">
        <i class="fa-solid fa-circle-exclamation text-base shrink-0"></i>
        <span>{{ errorMessage }}</span>
      </div>
      <button type="button" (click)="errorMessage = ''" class="p-1 cursor-pointer">
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>
    </div>

    <div
      *ngIf="successMessage"
      class="p-3.5 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-500 flex items-center gap-2.5 text-xs sm:text-sm"
    >
      <i class="fa-solid fa-circle-check text-base shrink-0"></i>
      <span>{{ successMessage }}</span>
    </div>

    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <div
          [ngClass]="
            isFieldInvalid('email')
              ? 'border-red-500 bg-red-500/5'
              : themeService.isDarkMode()
                ? 'bg-[#151228] border-white/10 focus-within:border-purple-500/80'
                : 'bg-slate-50 border-slate-200 focus-within:bg-white focus-within:border-purple-600'
          "
          class="border rounded-xl px-4 py-2.5 transition-all"
        >
          <label
            [ngClass]="themeService.isDarkMode() ? 'text-slate-400' : 'text-slate-500'"
            class="block text-[11px] font-semibold mb-1"
          >
            Email address
          </label>
          <div class="flex items-center gap-3">
            <i class="fa-regular fa-envelope text-sm text-slate-400"></i>
            <input
              type="email"
              formControlName="email"
              placeholder="Enter your email address"
              class="w-full bg-transparent border-none text-sm focus:outline-none p-0 font-medium"
            />
          </div>
        </div>
        <p *ngIf="isFieldInvalid('email')" class="text-red-400 text-xs mt-1 px-1">
          {{ getFieldError('email') }}
        </p>
      </div>

      <button
        type="submit"
        [disabled]="isSubmitting"
        class="w-full py-3.5 px-6 bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 hover:from-blue-500 hover:via-indigo-500 hover:to-purple-500 text-white font-semibold text-sm rounded-xl shadow-lg shadow-purple-600/25 transition-all cursor-pointer disabled:opacity-60"
      >
        {{ isSubmitting ? 'Sending...' : 'Send Reset Link' }}
      </button>
    </form>

    <div
      [ngClass]="themeService.isDarkMode() ? 'text-slate-400' : 'text-slate-500'"
      class="text-center text-xs"
    >
      Remember your password?
      <a routerLink="/auth/login" class="text-purple-400 hover:text-purple-300 font-semibold ml-1 hover:underline">
        Back to Login
      </a>
    </div>
  </div>
</div>
